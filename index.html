<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f1e8">
  <title>Our Table Photos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <svg class="sprig" viewBox="0 0 120 40" aria-hidden="true">
      <path d="M6 30 C 40 30, 70 22, 114 8" fill="none" stroke="currentColor" stroke-width="1"/>
      <g fill="currentColor" opacity=".85">
        <ellipse cx="30" cy="25" rx="7" ry="3" transform="rotate(-30 30 25)"/>
        <ellipse cx="34" cy="33" rx="7" ry="3" transform="rotate(20 34 33)"/>
        <ellipse cx="58" cy="19" rx="7" ry="3" transform="rotate(-35 58 19)"/>
        <ellipse cx="63" cy="28" rx="7" ry="3" transform="rotate(15 63 28)"/>
        <ellipse cx="86" cy="12" rx="6" ry="2.6" transform="rotate(-40 86 12)"/>
        <ellipse cx="92" cy="21" rx="6" ry="2.6" transform="rotate(10 92 21)"/>
      </g>
    </svg>
    <p class="eyebrow">Wedding Dinner</p>
    <h1>Our Table Photos</h1>
    <p class="lead">今日の一枚を、みんなで。</p>
    <p class="meta"><span id="eventDate"></span><span class="dot">·</span><span id="venue"></span></p>
  </header>

  <main>
    <section class="card upload" id="uploadSection">
      <h2><span class="en">Share</span>写真を送る</h2>
      <p class="note">撮った写真を選ぶと、チェキ風に仕上げてみんなのアルバムに届きます。</p>
      <label class="field">
        <span>お名前（任意）</span>
        <input id="author" type="text" maxlength="20" placeholder="例：はなこ" autocomplete="nickname">
      </label>
      <div class="actions">
        <label class="btn primary">
          <input id="pickFiles" type="file" accept="image/*" multiple hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>
          写真を選ぶ
        </label>
        <label class="btn">
          <input id="takePhoto" type="file" accept="image/*" capture="environment" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          撮影する
        </label>
      </div>
      <div class="queue" id="queue" hidden></div>
    </section>

    <section class="gallery-wrap">
      <div class="gallery-head">
        <h2><span class="en">Album</span>みんなのアルバム <small id="count"></small></h2>
        <div class="tools">
          <button class="chip" id="selectToggle" type="button">選んで保存</button>
        </div>
      </div>
      <div class="filters" id="filters" hidden></div>
      <div class="gallery" id="gallery"></div>
      <p class="empty" id="empty">まだ写真がありません。<br>最初の一枚をどうぞ。</p>
    </section>
  </main>

  <footer class="foot">
    <p>Thank you for celebrating with us.</p>
  </footer>

  <!-- 選択モードのバー -->
  <div class="select-bar" id="selectBar" hidden>
    <button class="chip ghost" id="selectAll" type="button">すべて選択</button>
    <span id="selectedCount">0枚</span>
    <button class="btn primary small" id="saveSelected" type="button" disabled>保存する</button>
  </div>

  <!-- 拡大表示 -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" type="button" aria-label="閉じる">×</button>
    <button class="lb-nav prev" id="lbPrev" type="button" aria-label="前の写真">‹</button>
    <button class="lb-nav next" id="lbNext" type="button" aria-label="次の写真">›</button>
    <figure class="lb-stage">
      <img id="lbImg" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <div class="lb-bar">
      <div class="seg" role="tablist">
        <button type="button" class="on" data-ver="cheki">チェキ</button>
        <button type="button" data-ver="original">オリジナル</button>
      </div>
      <button class="btn primary small" id="lbSave" type="button">保存</button>
      <button class="chip ghost danger" id="lbDelete" type="button" hidden>削除</button>
    </div>
    <p class="lb-hint">画像を長押ししても保存できます</p>
  </div>

  <!-- 保存準備・メッセージ -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-body">
      <p class="sheet-title" id="sheetTitle"></p>
      <p class="sheet-text" id="sheetText"></p>
      <div class="progress" id="sheetProgress" hidden><span></span></div>
      <div class="sheet-actions">
        <button class="btn primary" id="sheetOk" type="button" hidden>OK</button>
        <button class="chip ghost" id="sheetCancel" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script src="js/config.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
