<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Table QR Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f6f1e8; --ink: #3a3129; --soft: #7a6c5d; --oak: #a87f55; --oak-deep: #6f4f33; --sage: #7f8f72; --line: #ddd1bf; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e2d6; color: var(--ink); font-family: 'Shippori Mincho', serif; letter-spacing: .04em; }
    .panel { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    .panel h1 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
    .panel p { font-size: 13px; color: var(--soft); margin: 0 0 16px; }
    label { display: block; font-size: 12px; color: var(--soft); margin: 12px 0 4px; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-family: inherit; }
    button { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--oak-deep); background: #fff; color: var(--oak-deep); font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
    button.primary { background: var(--oak-deep); color: #fff; }
    .url { font-size: 11px; word-break: break-all; color: var(--soft); background: #fff; padding: 8px 10px; border-radius: 6px; margin-top: 12px; }
    .buttons { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

    .sheet { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; padding: 8px 16px 40px; }
    /* A6 サイズのテーブルカード */
    .qr-card {
      width: 105mm; height: 148mm;
      background: var(--paper);
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: 13mm 10mm 9mm;
      text-align: center;
      box-shadow: 0 10px 30px rgba(60, 40, 20, .18);
      overflow: hidden;
    }
    .qr-card::before {
      content: ''; position: absolute; inset: 4mm;
      border: .3mm solid var(--oak); opacity: .55; pointer-events: none;
    }
    .sprig { width: 26mm; color: var(--sage); }
    .eyebrow { font-family: 'Cormorant Garamond', serif; font-size: 9pt; letter-spacing: .32em; text-transform: uppercase; color: var(--oak); margin-top: 2mm; }
    .title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 26pt; color: var(--oak-deep); line-height: 1.1; margin: 1.5mm 0 1mm; }
    .lead { font-size: 9.5pt; letter-spacing: .14em; margin-bottom: 5mm; }
    .qr-frame { background: #fff; padding: 3.5mm; box-shadow: 0 .5mm 2mm rgba(60, 40, 20, .15); }
    #qr, #qr img, #qr canvas { width: 40mm !important; height: 40mm !important; display: block; }
    .steps { margin: 5mm 0 0; padding: 0; list-style: none; font-size: 8pt; line-height: 1.9; text-align: left; color: var(--ink); }
    .steps li::before { content: counter(s); counter-increment: s; display: inline-block; width: 4.2mm; height: 4.2mm; line-height: 4.2mm; border-radius: 50%; background: var(--oak); color: #fff; font-size: 6.5pt; text-align: center; margin-right: 2mm; font-family: 'Cormorant Garamond', serif; }
    .steps { counter-reset: s; }
    .date { margin-top: auto; font-family: 'Cormorant Garamond', serif; font-size: 10pt; letter-spacing: .25em; color: var(--soft); }

    @media print {
      @page { size: A6; margin: 0; }
      body { background: none; }
      .panel { display: none; }
      .sheet { padding: 0; gap: 0; }
      .qr-card { box-shadow: none; page-break-after: always; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>テーブル用QRカード</h1>
    <p>アプリのURLと合言葉（GASのスクリプトプロパティ TOKEN と同じもの）を入力して印刷してください。A6サイズで印刷されます。</p>
    <label for="appUrl">アプリのURL（GitHub PagesのURL）</label>
    <input id="appUrl" type="url" placeholder="https://xxxx.github.io/photoApp/">
    <label for="token">合言葉（TOKEN）</label>
    <div class="row">
      <input id="token" type="text" placeholder="英数字のランダム文字列">
      <button id="gen" type="button">合言葉を作る</button>
    </div>
    <div class="url" id="fullUrl"></div>
    <div class="buttons">
      <button class="primary" id="print" type="button">印刷する</button>
      <button id="copy" type="button">URLをコピー</button>
    </div>
  </div>

  <div class="sheet">
    <div class="qr-card">
      <svg class="sprig" viewBox="0 0 120 40" aria-hidden="true">
        <path d="M6 30 C 40 30, 70 22, 114 8" fill="none" stroke="currentColor" stroke-width="1"/>
        <g fill="currentColor" opacity=".85">
          <ellipse cx="30" cy="25" rx="7" ry="3" transform="rotate(-30 30 25)"/>
          <ellipse cx="34" cy="33" rx="7" ry="3" transform="rotate(20 34 33)"/>
          <ellipse cx="58" cy="19" rx="7" ry="3" transform="rotate(-35 58 19)"/>
          <ellipse cx="63" cy="28" rx="7" ry="3" transform="rotate(15 63 28)"/>
          <ellipse cx="86" cy="12" rx="6" ry="2.6" transform="rotate(-40 86 12)"/>
          <ellipse cx="92" cy="21" rx="6" ry="2.6" transform="rotate(10 92 21)"/>
        </g>
      </svg>
      <div class="eyebrow">Share your photos</div>
      <div class="title">Our Table Photos</div>
      <div class="lead">今日の一枚を、みんなで。</div>
      <div class="qr-frame"><div id="qr"></div></div>
      <ol class="steps">
        <li>カメラでQRコードを読み取る</li>
        <li>「写真を選ぶ」から撮った写真を送る</li>
        <li>みんなの写真は、いつでも保存OK</li>
      </ol>
      <div class="date" id="cardDate"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    (function () {
      const $ = id => document.getElementById(id);
      const cfg = window.APP_CONFIG || {};
      const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(cfg.EVENT_DATE || '');
      $('cardDate').textContent = m ? `${m[1]}.${m[2].padStart(2, '0')}.${m[3].padStart(2, '0')}` : '';

      const base = location.href.replace(/[^/]*$/, '');
      $('appUrl').value = /^https?:/.test(base) ? base : '';

      const qr = new QRCode($('qr'), { width: 512, height: 512, colorDark: '#3a3129', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });

      function fullUrl() {
        const u = $('appUrl').value.trim();
        const t = $('token').value.trim();
        if (!u) return '';
        return u + (u.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(t);
      }
      function update() {
        const url = fullUrl();
        $('fullUrl').textContent = url || 'URLを入力してください';
        if (url) qr.makeCode(url); else qr.clear();
      }
      $('gen').addEventListener('click', () => {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
        const arr = new Uint32Array(20);
        crypto.getRandomValues(arr);
        $('token').value = Array.from(arr, n => chars[n % chars.length]).join('');
        update();
      });
      $('appUrl').addEventListener('input', update);
      $('token').addEventListener('input', update);
      $('print').addEventListener('click', () => window.print());
      $('copy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(fullUrl()); $('copy').textContent = 'コピーしました'; } catch (e) {}
      });
      update();
    })();
  </script>
</body>
</html>
